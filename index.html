<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANVEER BIRD</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        /* स्क्रीन के ऊपर हमेशा दिखने वाला टेक्स्ट */
        .creator-banner {
            background: #ff4500;
            color: #ffd700;
            padding: 6px 15px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 8px;
            box-shadow: 0 0 10px #ff4500;
            letter-spacing: 1px;
            text-align: center;
        }
        canvas {
            border: 4px solid #ffd700;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .controls {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- तुम्हारे कहे अनुसार स्क्रीन के ऊपर परमानेंट हेडिंग -->
    <div class="creator-banner">👑 Ranveer ka game Maine Banaya Hai 👑</div>
    
    <canvas id="gameCanvas" width="400" height="480"></canvas>
    
    <div class="controls">
        (Spacebar दबाओ या स्क्रीन पर Click/Tap करो उड़ने के लिए!)
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game Variables - Playable & Smooth Settings
let birdX = 70;
let birdY = 200;
let birdRadius = 15;
let gravity = 0.35;    // स्पीड कम की ताकि नीचे धड़ाम से ना गिरे
let lift = -7;         // जंप को स्मूथ किया
let velocity = 0;

let pipeWidth = 65;
let pipeGap = 160;     // गैپ को बड़ा किया ताकि निकलने में आसानी हो
let pipeSpeed = 2.0;   // पाइप चलने की स्पीड धीमी की (आराम से खेल सको)
let pipes = [];

let score = 0;
let highScore = 0;
let isGameOver = false;
let gameStarted = false;

// Controls
document.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        e.preventDefault();
        makeJump();
    }
});

canvas.addEventListener("click", function() {
    makeJump();
});

function makeJump() {
    if (isGameOver) {
        resetGame();
    } else if (!gameStarted) {
        gameStarted = true;
    } else {
        velocity = lift;
    }
}

function resetGame() {
    birdY = 200;
    velocity = 0;
    pipes = [];
    score = 0;
    isGameOver = false;
    gameStarted = true;
}

// Spawn Pipes
function spawnPipe() {
    let minHeight = 60;
    let maxHeight = canvas.height - pipeGap - 60;
    let height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
    
    pipes.push({
        x: canvas.width,
        top: height,
        bottom: canvas.height - height - pipeGap,
        passed: false
    });
}

// Main Game Loop
let frameCount = 0;
function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameStarted) {
        // Start Screen
        ctx.fillStyle = "#ffd700";
        ctx.font = "bold 20px Courier New";
        ctx.textAlign = "center";
        ctx.fillText("TAP OR SPACE TO START", canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.fillStyle = "#00ffff";
        ctx.font = "15px Courier New";
        ctx.fillText("👑 Raja Ranveer ka Safar 👑", canvas.width / 2, canvas.height / 2 + 20);
        requestAnimationFrame(update);
        return;
    }

    if (!isGameOver) {
        velocity += gravity;
        birdY += velocity;

        // Pipe Generation - धीमे टाइम पर पाइप आएंगे (हर 120 फ्रेम में)
        if (frameCount % 120 === 0) {
            spawnPipe();
        }
        frameCount++;

        // Pipe Movement & Collision
        for (let i = pipes.length - 1; i >= 0; i--) {
            pipes[i].x -= pipeSpeed;

            // Draw Pipes (Ranveer Theme Style)
            ctx.fillStyle = "#ff4500";
            ctx.fillRect(pipes[i].x, 0, pipeWidth, pipes[i].top);
            ctx.fillRect(pipes[i].x, canvas.height - pipes[i].bottom, pipeWidth, pipes[i].bottom);

            // Pipe Border glow
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 2;
            ctx.strokeRect(pipes[i].x, 0, pipeWidth, pipes[i].top);
            ctx.strokeRect(pipes[i].x, canvas.height - pipes[i].bottom, pipeWidth, pipes[i].bottom);

            // Score check
            if (!pipes[i].passed && pipes[i].x + pipeWidth < birdX) {
                score++;
                if (score > highScore) highScore = score;
                pipes[i].passed = true;
            }

            // Collision Check (थोड़ा सा मार्जिन दिया है ताकि गेम फेयर लगे)
            if (
                birdX + birdRadius - 4 > pipes[i].x &&
                birdX - birdRadius + 4 < pipes[i].x + pipeWidth &&
                (birdY - birdRadius + 4 < pipes[i].top || birdY + birdRadius - 4 > canvas.height - pipes[i].bottom)
            ) {
                isGameOver = true;
            }

            // Remove off-screen pipes
            if (pipes[i].x + pipeWidth < 0) {
                pipes.splice(i, 1);
            }
        }

        // Floor and Ceiling Collision
        if (birdY + birdRadius >= canvas.height || birdY - birdRadius <= 0) {
            isGameOver = true;
        }
    }

    // Draw Ranveer Bird (Custom Character - 'R')
    ctx.fillStyle = "#00ffff";
    ctx.beginPath();
    ctx.arc(birdX, birdY, birdRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#ffd700";
    ctx.stroke();

    // Bird Text (RANVEER Initial 'R')
    ctx.fillStyle = "#000";
    ctx.font = "bold 16px Courier New";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("R", birdX, birdY);

    // Draw Score Board
    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 16px Courier New";
    ctx.textAlign = "left";
    ctx.fillText("RANVEER SCORE: " + score, 20, 30);
    ctx.fillText("HI-SCORE: " + highScore, 20, 55);

    // Game Over Screen
    if (isGameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ff4500";
        ctx.font = "bold 24px Courier New";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER, BHAI!", canvas.width / 2, canvas.height / 2 - 40);

        ctx.fillStyle = "#00ffff";
        ctx.font = "15px Courier New";
        ctx.fillText("Ranveer ka Score: " + score, canvas.width / 2, canvas.height / 2);

        ctx.fillStyle = "#ffd700";
        ctx.font = "bold 13px Courier New";
        ctx.fillText("Dubara Rola Jamane ke liye Click karein", canvas.width / 2, canvas.height / 2 + 40);
    }

    requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>

</body>
</html>
